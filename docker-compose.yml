version: "3.9"

services:
  backend:
    build: ./backend
    container_name: placement-backend
    ports:
      - "5000:5000"
    volumes:
      - placement_data:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: placement-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  placement_data: